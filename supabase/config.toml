[edge]
headless = false

[functions.test-health]
enabled = true
verify_jwt = false
import_map = "./functions/test-health/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/test-health/index.ts"
