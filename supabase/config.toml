project_id = "cardsemble"

[api]
enabled = true
port = 5432
db_schema = "public"
max_connections = 200

[db]
port = 5432

[studio]
enabled = true
port = 5123

[functions.card-events]
verify_jwt = true

[functions.api]
verify_jwt = false

[functions.cron]
verify_jwt = false

[functions.card-catalog-sync]
